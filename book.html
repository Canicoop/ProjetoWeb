<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Livraria Central</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Livraria Central</h1>
    <div class="wishlist">♡</div>
  </header>

  <section class="book-detail">

    <a href="index.html" class="back-link">← Voltar</a>

    <div class="detail-content">

      <img id="bookImage" src="" alt="">

      <div class="detail-info">
        <h2 id="bookTitle"></h2>
        <p class="author" id="bookAuthor"></p>

        <div class="genres" id="bookGenres"></div>

        <p class="description" id="bookDescription"></p>

        <p class="publisher"><strong>Editora:</strong> <span id="bookPublisher"></span></p>
        <p class="isbn"><strong>ISBN:</strong> <span id="bookIsbn"></span></p>
        
        <div class="buy-links" id="buyLinks"></div>
      </div>

    </div>

  </section>

  <script src="book.js"></script>
</body>
</html>
